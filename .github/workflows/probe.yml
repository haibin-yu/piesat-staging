name: GEO 监测探测

on:
  schedule:
    - cron: '0 1 * * 1'   # 每周一 UTC 01:00 = 北京时间 09:00
  workflow_dispatch: {}     # 支持手动触发

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 各引擎独立探测：单引擎失败不中断整个 workflow（成本护栏——密钥过期时跳过该引擎、其余照跑、下次补跑）
      - name: 探测 豆包·搜索
        continue-on-error: true
        run: node scripts/probe.mjs doubao
        env:
          DOUBAO_SEARCH_KEY: ${{ secrets.DOUBAO_SEARCH_KEY }}

      - name: 探测 豆包·模型
        continue-on-error: true
        run: node scripts/probe.mjs doubao_model
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}

      - name: 探测 DeepSeek
        continue-on-error: true
        run: node scripts/probe.mjs deepseek
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: 提交数据变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/
          if git diff --cached --quiet; then
            echo "本次探测无数据变化，跳过提交"
          else
            git commit -m "自动探测 $(date +%F)"
            git push
          fi
