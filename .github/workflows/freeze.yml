name: GEO 月度封存

on:
  schedule:
    - cron: '10 0 1 * *'   # 每月 1 号 00:10 UTC，封存上月
  workflow_dispatch: {}     # 支持手动触发

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 封存上月 AI 数据
        run: node scripts/freeze-month.mjs

      - name: 提交封存变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/monthly/ data/summary.json
          if git diff --cached --quiet; then
            echo "本月无封存变化，跳过提交"
          else
            git commit -m "月度封存 $(date +%F)"
            git push
          fi
